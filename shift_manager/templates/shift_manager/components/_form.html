<form action="{% url form_action %}" method="post" class="bg-white rounded-lg shadow-md p-6">
    {% csrf_token %}
    
    <h2 class="text-2xl font-bold mb-4">{{ form_title }}</h2>
    
    <div class="space-y-4">
        {{ form.as_div }}
    </div>
    
    <div class="mt-6">
        <button type="submit" name="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition-colors">
            {{ submit_button_text|default:"Submit" }}
        </button>
    </div>
</form>
